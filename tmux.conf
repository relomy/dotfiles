# set modern terminfo
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,screen-256color:RGB,tmux-256color:RGB"

# set 30k line history
set -g history-limit 30000

# messages don’t linger forever
set -g display-time 2000

# allow applications to detect focus events (editors/IDE terminals)
set -g focus-events on

# don't allow tmux to rename window - zsh does that
set-window-option -g automatic-rename off
set-option -g allow-rename off

# remap prefix to C-a
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# bind vertical/horizontal split keys
bind | split-window -h
bind - split-window -v

# quick view of processes
bind '~' split-window "exec htop"

# Use C-r to reload of the config file
unbind-key r
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# select panes with a mouse
# setw -g mode-mouse on

# start window and pane indexing at one instead of zero
set -g base-index 1
set -g pane-base-index 1

# resize windows on larger screens - if off the size is capped to the smallest
# screen size that has ever looked at it
setw -g aggressive-resize on

# helps in faster key repetition
set -sg escape-time 0

# show host name and IP address on left side of status bar
# set -g status-left-length 70
# set -g status-left "#[fg=green]: #h : #[fg=brightblue]#(curl icanhazip.com) #[fg=yellow]#(ifconfig en0 | grep 'inet ' | awk '{print \"en0 \" $2}') #(ifconfig en1 | grep 'inet ' | awk '{print \"en1 \" $2}') #[fg=red]#(ifconfig tun0 | grep 'inet ' | awk '{print \"vpn \" $2}') "

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# status bar theme (modern style options)
set -g status on
set -g status-justify centre
set -g status-left-length 100
set -g status-right-length 100

# unified styles (replaces old *-fg/*-bg/*-attr)
set -g status-style "bg=colour235"
set -g message-style "fg=colour222,bg=colour238"
set -g message-command-style "fg=colour222,bg=colour238"
set -g pane-active-border-style "fg=colour154"
set -g pane-border-style "fg=colour238"

